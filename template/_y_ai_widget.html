<link rel="stylesheet" href="{{ url_for('static', filename='y_ai.css') }}?v=fab-theme2">
<div id="y-ai-assistant"
     class="yai-pointer"
     data-endpoint="{{ request.endpoint or '' }}"
     aria-label="مساعد Y-ai"
     aria-expanded="false">
  <div class="yai-fab-wrap yai-pointer">
    <span class="yai-fab-ring yai-fab-ring--outer" aria-hidden="true"></span>
    <span class="yai-fab-ring yai-fab-ring--inner" aria-hidden="true"></span>
    <button type="button" class="yai-fab" data-yai-fab title="فتح Y-ai" aria-label="Y-ai">
      <span class="yai-fab-label">Y-ai</span>
    </button>
  </div>

  <div class="yai-panel yai-pointer" data-yai-panel role="dialog" aria-modal="true" aria-labelledby="yai-title">
    <header class="yai-header">
      <div class="yai-title" id="yai-title">
        <i class="fas fa-robot" style="color:#6366f1"></i>
        Y-ai
        <small class="yai-badge-offline">داخلي · بدون إنترنت</small>
      </div>
      <button type="button" class="yai-close" data-yai-close title="إغلاق">
        <i class="fas fa-times"></i>
      </button>
    </header>

    <div class="yai-chips">
      <button type="button" class="yai-chip" data-yai-chip-action="stats_all">إحصائيات عامة</button>
      <button type="button" class="yai-chip" data-yai-chip-action="departments">حسب القسم</button>
      <button type="button" class="yai-chip" data-yai-chip-action="overdue">المتأخرة</button>
      <button type="button" class="yai-chip" data-yai-chip-action="pending_reply">وارد بلا رد</button>
      <button type="button" class="yai-chip" data-yai-chip-summarize disabled>لخص الكتاب</button>
      <button type="button" class="yai-chip" data-yai-chip-action="guide">أرشدني</button>
      <button type="button" class="yai-chip" data-yai-chip-action="help">مساعدة</button>
    </div>

    <div class="yai-messages" data-yai-messages role="log" aria-live="polite"></div>

    <div class="yai-compose">
      <textarea class="yai-input" data-yai-input rows="2"
                placeholder="مثال: كيف أضيف صادر؟ · أرشدني · كم عدد الوارد؟"></textarea>
      <button type="button" class="yai-send" data-yai-send>إرسال</button>
    </div>
  </div>
</div>
