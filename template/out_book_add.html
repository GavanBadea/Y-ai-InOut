{% extends "base.html" %}
{% block title %}إضافة كتاب صادر{% endblock %}
{% block page_title %}<i class="fas fa-paper-plane me-2" style="color:#10b981"></i>إضافة كتاب صادر جديد{% endblock %}
{% block content %}

<div class="d-flex justify-content-end mb-3">
  <a href="{{ url_for('outgoing_list') }}" class="btn btn-outline-secondary btn-sm">
    <i class="fas fa-arrow-right me-1"></i>رجوع
  </a>
</div>

<div class="card border-0" style="max-width:700px;margin:auto">
  <div class="card-body p-4">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">
            رقم الكتاب الصادر (يدوي)
            {% if last_out_manual %}
            <span class="fw-400" style="color:var(--text-sub);font-size:.82rem">
              — آخر صادر مسجّل: <strong dir="ltr" style="color:var(--accent)">{{ last_out_manual }}</strong>
            </span>
            {% else %}
            <span class="fw-400" style="color:var(--text-sub);font-size:.82rem">— لا يوجد صادر سابق</span>
            {% endif %}
          </label>
          <input type="text" name="NoBook_Out_Manual" class="form-control"
                 placeholder="مثل: ص/1234/2024">
        </div>
        <div class="col-md-6">
          <label class="form-label">تاريخ الصادر</label>
          <input type="date" name="Date_Out" class="form-control" value="{{ today }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">الجهة المستقبلة</label>
          <select name="Add_Out_ID" class="form-select">
            <option value="">— اختر الجهة —</option>
            {% for d in dests %}
            <option value="{{ d['Add_OutNo'] }}">{{ d['Out_place'] }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">
            <i class="fas fa-reply me-1" style="color:var(--accent)"></i>رقم الواردة و الموضوع
          </label>
          <select name="Reply_To_InBook_No" class="form-select">
            <option value="">— غير مرتبط —</option>
            {% for b in in_books %}
            <option value="{{ b['NoBook_In'] }}">
              {{ b['NoBook_Dep'] or '—' }} — {{ (b['Subject_Com'] or '')[:40] }}
            </option>
            {% endfor %}
          </select>
          <div class="form-text">اختر إن كان هذا الكتاب رداً على كتاب وارد</div>
        </div>
        <div class="col-12">
          <label class="form-label">الموضوع <span class="text-danger">*</span></label>
          <textarea name="Subject" class="form-control" rows="3" required
                    placeholder="أدخل موضوع الكتاب الصادر..."></textarea>
        </div>

        <div class="col-12 d-flex gap-2 mt-2">
          <button type="submit" class="btn btn-success px-4">
            <i class="fas fa-save me-2"></i>حفظ
          </button>
          <a href="{{ url_for('outgoing_list') }}" class="btn btn-outline-secondary px-4">إلغاء</a>
        </div>
      </div>
    </form>
  </div>
</div>

{% endblock %}
