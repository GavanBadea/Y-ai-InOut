{# يتطلب قبل التضمين: naps2_list_url، و naps2_attach_url (اختياري — صفحة الإضافة بدون ربط) #}
{# اختياري: naps2_panel_title — عنوان البطاقة، naps2_scan_button_label — نص زر المسح #}
<div class="card border-0 mb-3 no-print naps2-scan-card"
     data-naps2-panel
     data-list-url="{{ naps2_list_url }}"
     {% if naps2_attach_url %}data-attach-url="{{ naps2_attach_url }}"{% endif %}
     {% if naps2_category %}data-category="{{ naps2_category }}"{% endif %}
     {% if naps2_record_pk is defined and naps2_record_pk %}data-record-pk="{{ naps2_record_pk }}"{% endif %}
     {% if naps2_relation_id is defined and naps2_relation_id %}data-relation-id="{{ naps2_relation_id }}"{% endif %}
     {% if naps2_department_name is defined and naps2_department_name %}data-department-name="{{ naps2_department_name|e }}"{% endif %}
     {% if naps2_save_scan_url is defined and naps2_save_scan_url %}data-save-scan-url="{{ naps2_save_scan_url }}"{% endif %}>
  <div class="card-header py-2" style="background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.25)">
    <h6 class="mb-0 fw-700" style="font-size:.92rem">
      <i class="fas fa-print me-2" style="color:#10b981"></i>{{ naps2_panel_title or 'مسح ضوئي' }}
    </h6>
  </div>
  <div class="card-body py-3">
    <button type="button" class="btn btn-lg btn-success w-100 fw-bold mb-2 shadow-sm text-wrap"
            style="font-size:.92rem;line-height:1.4;border-radius:12px;padding-top:.75rem;padding-bottom:.75rem"
            data-naps2-run>
      <i class="fas fa-print me-2"></i>{{ naps2_scan_button_label or 'بدء المسح الضوئي' }}
    </button>
    <div class="small mt-1" data-naps2-confirm style="min-height:1.1rem"></div>

    {% if naps2_save_scan_url is defined and naps2_save_scan_url %}
    <button type="button" class="btn btn-outline-success w-100 mt-2" data-naps2-upload-file>
      <i class="fas fa-upload me-1"></i>رفع ملف
    </button>
    <input type="file" class="d-none" data-naps2-upload-input
           accept=".pdf,.png,.jpg,.jpeg,.tiff,.tif,.bmp">
    {% endif %}

    <div class="small mt-2 text-muted" data-naps2-status style="min-height:1.25rem"></div>
  </div>
</div>
