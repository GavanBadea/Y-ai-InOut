<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Y-ai — تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="{{ url_for('static', filename='mobile-portrait.js') }}?v=portrait5"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=portrait5">
</head>
<body class="login-body">
<div class="login-page">
  <div class="login-card">
    <div class="text-center mb-4">
      <div style="width:70px;height:70px;background:linear-gradient(135deg,#3b82f6,#818cf8);
                  border-radius:20px;display:flex;align-items:center;justify-content:center;
                  margin:0 auto 14px;box-shadow:0 8px 28px rgba(59,130,246,.55)">
        <i class="fas fa-file-alt" style="font-size:1.8rem;color:#fff"></i>
      </div>
      <h4 class="fw-800" style="color:#fff;font-size:1.35rem">Y-ai الصادر والوارد</h4>
      <p style="color:rgba(255,255,255,.5);font-size:.85rem;margin:0">
        <i class="fas fa-sign-in-alt me-1"></i>تسجيل الدخول
      </p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} mb-3" style="border-radius:10px;font-size:.88rem">
        <i class="fas fa-info-circle me-2"></i>{{ msg }}
      </div>
      {% endfor %}
    {% endwith %}

    {% if error %}
    <div class="alert alert-danger mb-3" style="border-radius:10px;font-size:.88rem">
      <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
    </div>
    {% endif %}

    <form method="POST" class="login-form" autocomplete="on">
      <div class="mb-3">
        <label class="form-label fw-600" for="login-username">اسم المستخدم</label>
        <div class="input-group login-input-group">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input type="text" name="username" id="login-username" class="form-control"
                 placeholder="أدخل اسم المستخدم" required autofocus autocomplete="username">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-600" for="login-password">كلمة المرور</label>
        <div class="input-group login-input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" name="password" id="login-password" class="form-control"
                 placeholder="أدخل كلمة المرور" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold login-submit-btn">
        <i class="fas fa-sign-in-alt me-2"></i>دخول
      </button>
    </form>
    <p class="login-relogin-hint text-center mb-0 mt-3">
      <a href="{{ url_for('login', relogin=1) }}" class="login-relogin-link">تسجيل دخول بحساب آخر</a>
    </p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
