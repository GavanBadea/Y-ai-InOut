<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Y-ai — الإعداد الأولي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-page">
  <div class="login-card" style="max-width:460px">

    <div class="text-center mb-4">
      <div style="width:66px;height:66px;background:linear-gradient(135deg,#10b981,#3b82f6);
                  border-radius:18px;display:flex;align-items:center;justify-content:center;
                  margin:0 auto 12px;box-shadow:0 8px 24px rgba(16,185,129,.5)">
        <i class="fas fa-user-tie" style="font-size:1.7rem;color:#fff"></i>
      </div>
      <h5 class="fw-800" style="color:#fff">إنشاء أول مستخدم (المدير)</h5>
      <p style="color:rgba(255,255,255,.5);font-size:.82rem;margin:0;line-height:1.7">
        هذا الحساب هو المدير وله كامل الصلاحيات.<br>
        بعدها ينشئ المدير باقي المستخدمين من داخل البرنامج.
      </p>
    </div>

    {% if error %}
    <div class="alert alert-danger mb-3" style="border-radius:10px;font-size:.88rem">
      <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
    </div>
    {% endif %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-600">اسم المستخدم</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user-tie"></i></span>
          <input type="text" name="new_username" class="form-control"
                 placeholder="مثل: محمد / مدير / admin ..."
                 required autofocus autocomplete="off">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-600">كلمة المرور</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" id="pw1" name="new_password" class="form-control"
                 placeholder="اختر كلمة مرور" required autocomplete="new-password">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-600">تأكيد كلمة المرور</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock-open"></i></span>
          <input type="password" id="pw2" name="confirm_password" class="form-control"
                 placeholder="أعد إدخال كلمة المرور" required autocomplete="new-password"
                 oninput="checkMatch()">
        </div>
        <div id="match-msg" style="font-size:.78rem;margin-top:4px"></div>
      </div>
      <button type="submit" id="submit-btn" class="btn btn-success w-100 py-2 fw-bold"
              style="border-radius:12px">
        <i class="fas fa-user-plus me-2"></i>إنشاء المدير والمتابعة لتسجيل الدخول
      </button>
    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function checkMatch() {
  const p1 = document.getElementById('pw1').value;
  const p2 = document.getElementById('pw2').value;
  const msg = document.getElementById('match-msg');
  const btn = document.getElementById('submit-btn');
  if (!p2) { msg.textContent = ''; return; }
  if (p1 === p2) {
    msg.innerHTML = '<span style="color:#6ee7b7"><i class="fas fa-check me-1"></i>كلمتا المرور متطابقتان</span>';
    btn.disabled = false;
  } else {
    msg.innerHTML = '<span style="color:#f87171"><i class="fas fa-times me-1"></i>كلمتا المرور غير متطابقتين</span>';
    btn.disabled = true;
  }
}
</script>
</body>
</html>
